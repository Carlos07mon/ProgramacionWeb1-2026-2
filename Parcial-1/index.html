<!DOCTYPE html>
<html lang="es">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tarjeta de perfil</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <main>
        <article class="tarjeta">

            <img
                class="avatar"

                alt="Foto de perfil de Laura Gómez"

            <h2>Laura Gómez</h2>

            </div>

        </article>
    </main>

</body>

</html>
